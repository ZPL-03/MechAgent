llm:
  provider: openai_compatible
  base_url: ${URL}
  api_key: ${API_KEY}
  model: ${MODEL_NAME}
  temperature: 0.1

solver:
  default: calculix
  calculix:
    path: ${CALCULIX_CCX:-ccx}
    num_cpus: 1
    timeout: 3600
  abaqus:
    path: ${ABAQUS_LAUNCHER:-D:/Abaqus2023/Commands/abaqus.bat}
    num_cpus: 1
    timeout: 3600
    max_concurrent: 1
    license_probe: null

mesher:
  default: calculix-inp
  min_quality: 0.3

knowledge:
  raw_dir: knowledge/sources
  external_dir: knowledge/external
  index_path: knowledge/index.jsonl
  top_k: 5
  chunk_size: 1200
  chunk_overlap: 120
  bm25_weight: 0.55
  tfidf_weight: 0.45

orchestrator:
  mode: dag
  use_llm_agents: false

output:
  default_format: markdown
  output_dir: mechagent_output

studio:
  database: mechagent_output/.studio/jobs.sqlite3
  artifact_root: mechagent_output/.studio/objects
  artifact_backend: filesystem
  artifact_s3_bucket: ""
  artifact_s3_prefix: mechagent
  max_workers: 2
  max_queued: 32
  max_active_jobs_per_project: 8
  max_result_bytes: 104857600
  max_storage_bytes: null
  startup_timeout: 60
  heartbeat_timeout: 30
  job_timeout: 7200
