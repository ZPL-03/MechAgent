name: signed-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-sign-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Validate release tag
        shell: pwsh
        run: python scripts/check_release_tag.py --tag "${{ github.ref_name }}"
      - name: Install packages and build frontend
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/mechagent-core
          python -m pip install -e "packages/mechagent[dev,docs]"
          npm --prefix apps/mechagent-studio ci --no-audit --no-fund
          npm --prefix apps/mechagent-studio run build
          git diff --exit-code -- packages/mechagent/src/mechagent/ui/static
      - name: Run release quality gates
        shell: pwsh
        run: |
          npm --prefix apps/mechagent-studio test
          python scripts/check_env.py --profile portable
          python -m ruff format --check packages tests scripts
          python -m ruff check packages tests scripts
          python -m mypy packages scripts tests
          python -m pytest -m "not real_solver"
          python scripts/build_knowledge.py
          python scripts/index_knowledge.py
          python -m mechagent.cli config validate
          python -m pip check
          python scripts/audit_python_dependencies.py --runtime-only --timeout 30 --output dist/mechagent-python-runtime-audit.json
          python scripts/studio_http_smoke.py --output-dir dist/studio-http-evidence
          python -m mechagent.cli verify-evidence --require-provenance dist/studio-http-evidence/manifest.json
          python -m mkdocs build --strict
      - name: Build release assets
        shell: pwsh
        run: |
          python -m build packages/mechagent-core
          python -m build packages/mechagent
          python scripts/generate_sbom.py --output dist/mechagent-sbom.spdx.json
          python scripts/build_release_manifest.py --output dist/mechagent-release-manifest.json
          python scripts/check_wheel_install.py
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
      - name: Attest build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            packages/mechagent-core/dist/*
            packages/mechagent/dist/*
            dist/mechagent-sbom.spdx.json
            dist/mechagent-release-manifest.json
      - name: Verify build provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $workflow = "github.com/${{ github.repository }}/.github/workflows/release.yml"
          $sourceRef = "refs/tags/${{ github.ref_name }}"
          $subjects = @(
            (Get-ChildItem packages/mechagent-core/dist -File),
            (Get-ChildItem packages/mechagent/dist -File),
            (Get-Item dist/mechagent-sbom.spdx.json),
            (Get-Item dist/mechagent-release-manifest.json)
          )
          foreach ($subject in $subjects) {
            gh attestation verify $subject.FullName `
              --repo $repo `
              --signer-workflow $workflow `
              --source-ref $sourceRef `
              --cert-oidc-issuer "https://token.actions.githubusercontent.com"
            if ($LASTEXITCODE -ne 0) {
              throw "构建 provenance 验证失败: $($subject.FullName)"
            }
          }
      - name: Sign release manifest with GitHub OIDC
        shell: pwsh
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          python scripts/sign_release.py `
            --manifest dist/mechagent-release-manifest.json `
            --root . `
            --bundle dist/mechagent-release-manifest.sigstore.json `
            --expected-commit "${{ github.sha }}" `
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}" `
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
      - name: Verify signed release manifest
        shell: pwsh
        run: |
          python scripts/verify_release.py `
            --manifest dist/mechagent-release-manifest.json `
            --root . `
            --bundle dist/mechagent-release-manifest.sigstore.json `
            --expected-commit "${{ github.sha }}" `
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}" `
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
      - name: Upload signed release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            packages/mechagent-core/dist/*
            packages/mechagent/dist/*
            dist/mechagent-sbom.spdx.json
            dist/mechagent-release-manifest.json
            dist/mechagent-release-manifest.sigstore.json
