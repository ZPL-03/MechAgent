name: signed-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-sign-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Validate release tag
        shell: pwsh
        run: python scripts/check_release_tag.py --tag "${{ github.ref_name }}"
      - name: Install packages and build frontend
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/mechagent-core
          python -m pip install -e "packages/mechagent[dev,docs]"
          npm --prefix apps/mechagent-studio ci --no-audit --no-fund
          npm --prefix apps/mechagent-studio run build
      - name: Build release assets
        shell: pwsh
        run: |
          python -m build packages/mechagent-core --no-isolation
          python -m build packages/mechagent --no-isolation
          python scripts/generate_sbom.py --output dist/mechagent-sbom.spdx.json
          python scripts/build_release_manifest.py --output dist/mechagent-release-manifest.json
          python scripts/check_wheel_install.py
      - uses: sigstore/cosign-installer@v3
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            packages/mechagent-core/dist/*
            packages/mechagent/dist/*
            dist/mechagent-sbom.spdx.json
            dist/mechagent-release-manifest.json
      - name: Sign release manifest with GitHub OIDC
        shell: pwsh
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          python scripts/sign_release.py `
            --manifest dist/mechagent-release-manifest.json `
            --bundle dist/mechagent-release-manifest.sigstore.json `
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}" `
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
      - name: Upload signed release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/mechagent-core/dist/*
            packages/mechagent/dist/*
            dist/mechagent-sbom.spdx.json
            dist/mechagent-release-manifest.json
            dist/mechagent-release-manifest.sigstore.json
